name: Verify source build
on: [push, pull_request, workflow_dispatch]
jobs:
  validate:
    defaults:
      run:
        working-directory: reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: sudo apt-get update && sudo apt-get install -y gfortran gcc binutils liblapack-dev libblas-dev
      - run: python -m pip install -r requirements-lock.txt
      - run: python workspace/programs/weak_spherical/build.py
      - run: python -m unittest discover -s workspace/programs/weak_spherical -p 'test_spherical.py' -v
        env:
          OPENBLAS_NUM_THREADS: '1'
      - run: python scripts/reproduce.py --output results/ci --validate
        env:
          OPENBLAS_NUM_THREADS: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: weak-interaction-validation
          path: reproducible/results/ci/
